name: build

on:
  push:
    branches: [main]
    tags: ["v*"]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  core:
    name: core+shell (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 一个 OS 红不许把另两个取消掉:三端结论要各自拿到
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps (webkit for app build)
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
      - name: Build rewind-core
        working-directory: core
        run: cargo build --release
      - name: Stage ffmpeg for sidecar tests
        shell: bash
        run: |
          mkdir -p engines
          case "${{ matrix.os }}" in
            windows-*)
              curl -sL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              unzip -o -q ff.zip "ffmpeg-master-latest-win64-gpl/bin/*"
              cp ffmpeg-master-latest-win64-gpl/bin/{ffmpeg.exe,ffprobe.exe} engines/ ;;
            ubuntu-*)
              sudo apt-get update && sudo apt-get install -y ffmpeg
              cp "$(command -v ffmpeg)" "$(command -v ffprobe)" engines/ ;;
            macos-*)
              brew install ffmpeg
              cp "$(which ffmpeg)" "$(which ffprobe)" engines/ ;;
          esac
          echo "REWIND_FFMPEG_DIR=$GITHUB_WORKSPACE/engines" >> "$GITHUB_ENV"
      - name: Test core
        working-directory: core
        run: bash ../scripts/ci_step.sh cargo test --release
      - name: Test shell (sidecar protocol/cancel/preview)
        working-directory: shell
        run: bash ../scripts/ci_step.sh cargo test --release
      - name: E2E regression gate (95 项)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/engines:$PATH"
          bash scripts/ci_step.sh scripts/regression.sh
      - name: Parameter-axis gate (帧率/画幅可机读断言)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/engines:$PATH"
          bash scripts/ci_step.sh scripts/axis_check.sh
      - name: Aging-factor gate (做旧系数:单调/画幅恒定/爆炸档相变/确定性)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/engines:$PATH"
          bash scripts/ci_step.sh scripts/aging_check.sh
      - name: Preset variance gate (预设差异度:结构 + 色距/高频/块度)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/preset_variance.sh
      - name: Concurrency gate (并发预览/抽帧/成跑互不踩临时文件与成品名)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: |
          export PATH="$GITHUB_WORKSPACE/engines:$PATH"
          bash scripts/ci_step.sh scripts/conc_check.sh
      - name: Geometry gate (对比预览两层同几何 + 图片交付把 DAR 烘进像素)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/geo_check.sh
      - name: Parameter boundary gate (参数边界:倒挂范围 / 说人话的拒绝 / 合法极值仍可跑)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/safe_max.sh
      - name: NTSC signal-knob gate (12 个信号旋钮:默认零变化 / 逐个真改画面 / 越界带码)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/ntsc_check.sh
      - name: Parameter liveness gate (75 个参数逐个证明"拧了会在计划里留痕",防死控件)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/param_liveness.sh
      - name: Parameter pixels gate (每个视觉参数单独拧动必须改变成品帧;预览抽不到帧时退到成品帧)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/param_pixels.sh
      - name: Parameter audio gate (每个音频参数单独拧动必须改变成品音轨)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/param_audio.sh
      - name: i18n coverage gate (中英词典对齐 + 引擎字符串必须有英文对译)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh node scripts/i18n_check.js
      - name: Release hygiene check (许可/声明/版本/画廊资产)
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: bash scripts/ci_step.sh scripts/release_check.sh
      - name: Smoke era axis
        if: always()          # 一条闸红不许把后面的闸一起 skip 掉(一轮要看到全部坑)
        shell: bash
        run: |
          exe=${{ matrix.os == 'windows-latest' && './core/target/release/rewind-core.exe' || './core/target/release/rewind-core' }}
          $exe era 1990 | head -5
          $exe presets presets | head -5
      - uses: actions/upload-artifact@v4
        with:
          name: rewind-core-${{ matrix.os }}
          path: core/target/release/rewind-core${{ matrix.os == 'windows-latest' && '.exe' || '' }}

  app:
    name: tauri app (${{ matrix.os }})
    needs: core
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false        # 一个 OS 红不许把另两个取消掉:三端结论要各自拿到
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - name: Linux deps
        if: matrix.os == 'ubuntu-latest'
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev build-essential curl wget file libxdo-dev
      - name: Build app (debug, compile check)
        working-directory: app
        run: cargo build
      - uses: actions/download-artifact@v4
        with:
          name: rewind-core-${{ matrix.os }}
          path: engine
      - name: Stage engines + presets into app bundle
        shell: bash
        run: |
          mkdir -p app/engines app/presets
          cp presets/*.json app/presets/
          cp engine/rewind-core* app/engines/
          case "${{ matrix.os }}" in
            windows-*) 
              curl -sL -o ff.zip https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip
              unzip -o -q ff.zip "ffmpeg-master-latest-win64-gpl/bin/*"
              cp ffmpeg-master-latest-win64-gpl/bin/ffmpeg.exe ffmpeg-master-latest-win64-gpl/bin/ffprobe.exe app/engines/ ;;
            ubuntu-*)
              curl -sL -o ff.txz https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-linux64-gpl.tar.xz
              tar xf ff.txz --wildcards '*/bin/ffmpeg' '*/bin/ffprobe'
              cp ffmpeg-master-latest-linux64-gpl/bin/{ffmpeg,ffprobe} app/engines/ ;;
            macos-*)
              curl -sL -o ff.7z https://evermeet.cx/ffmpeg/getrelease/ffmpeg/7z
              curl -sL -o fp.7z https://evermeet.cx/ffmpeg/getrelease/ffprobe/7z
              7z e -y ff.7z fp.7z -oapp/engines/ || (brew install p7zip && 7z e -y ff.7z fp.7z -oapp/engines/) ;;
          esac
      - name: Verify staged bundle inputs (打包前断言暂存清单)
        shell: bash
        run: |
          # 少一个二进制就是"双击即用"变成"双击报错":这一步只认三样东西都在,
          # 并且确认它们没有被误提交进仓库(仓库里只该有 .gitkeep)
          set -e
          case "${{ matrix.os }}" in
            windows-*) EXE=.exe ;;
            *) EXE= ;;
          esac
          [ -f app/engines/rewind-core$EXE ] || { echo "FAIL 缺 app/engines/rewind-core$EXE"; ls -la app/engines; exit 1; }
          [ -f app/engines/ffmpeg$EXE ]      || { echo "FAIL 缺 app/engines/ffmpeg$EXE"; ls -la app/engines; exit 1; }
          [ -f app/engines/ffprobe$EXE ]     || { echo "FAIL 缺 app/engines/ffprobe$EXE"; ls -la app/engines; exit 1; }
          NSRC=$(ls presets/*.json | wc -l); NBIN=$(ls app/presets/*.json | wc -l)
          [ "$NSRC" = "$NBIN" ] || { echo "FAIL 预设没拷全:仓库 $NSRC / 暂存 $NBIN"; exit 1; }
          TRACKED=$(git ls-files app/engines app/presets | grep -v '\.gitkeep$' | wc -l | tr -d ' ')
          [ "$TRACKED" = "0" ] || { echo "FAIL 打包暂存二进制被提交了($TRACKED 个)"; exit 1; }
          echo "PASS 暂存清单齐全:引擎 3 件 + 预设 $NBIN 份,且未误入库"
      - name: Build app release bundle
        if: startsWith(github.ref, 'refs/tags/v')
        working-directory: app
        run: cargo build --release
      - uses: actions/upload-artifact@v4
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: rewind-app-${{ matrix.os }}
          path: |
            app/target/release/bundle/**
