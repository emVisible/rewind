[package]
name = "rewind-core"
version = "0.1.0"
edition = "2024"

[dependencies]
ntsc-rs = { path = "../vendor/ntsc-rs", features = ["rayon"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
rayon = "1"

[profile.release]
opt-level = 3
